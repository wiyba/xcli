<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex,nofollow" />
        <meta name="theme-color" content="#4E54C8" />
        <title>веба впн</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=2" />
        <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2" />
        <link
            href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0a0a;
                --bg-elev: #121212;
                --bg-elev-2: #171717;
                --border: #262626;
                --border-soft: #1c1c1c;
                --text: #dcdcdc;
                --text-dim: #a3a3a3;
                --text-mute: #525252;
                --text-faint: #404040;
                --accent-from: #8f94fb;
                --accent-to: #4e54c8;
                --up: #34d399;
                --down: #f87171;
                --warn: #fbbf24;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                overscroll-behavior: none;
            }
            body {
                font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
                background: var(--bg);
                color: var(--text);
                font-size: 14px;
                line-height: 1.55;
                min-height: 100vh;
                position: relative;
                overflow-x: hidden;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
            }
            ::selection {
                background: rgb(143 148 251 / 0.25);
                color: #fff;
            }
            .bg-grid {
                position: fixed;
                inset: 0;
                background:
                    linear-gradient(to right, rgba(128, 128, 128, 0.063) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(128, 128, 128, 0.063) 1px, transparent 1px);
                background-size: 24px 24px;
                -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
                mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
                pointer-events: none;
                z-index: 0;
            }
            main {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 48px 16px 16px;
            }
            h1 {
                font-family: "Unbounded", ui-sans-serif, system-ui, sans-serif;
                font-size: 22px;
                font-weight: 600;
                color: #fff;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            h1 img {
                width: 32px;
                height: 32px;
                border-radius: 8px;
            }
            .brand {
                --bg-size: 400%;
                background-image: linear-gradient(90deg, var(--accent-to), var(--accent-from), var(--accent-to));
                background-size: var(--bg-size) 100%;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            @media (prefers-reduced-motion: no-preference) {
                .brand {
                    animation: brand-shift 6s linear infinite;
                }
            }
            @keyframes brand-shift {
                to {
                    background-position: var(--bg-size) 0;
                }
            }
            .sub {
                font-size: 12px;
                color: var(--text-mute);
                margin-top: 4px;
            }
            .stack {
                margin-top: 28px;
                width: 100%;
                max-width: 480px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .card {
                background: var(--bg-elev);
                border: 1px solid var(--border-soft);
                border-radius: 12px;
                padding: 14px 18px;
            }
            .card.warn {
                background: color-mix(in oklab, var(--warn) 5%, transparent);
                border: 1.5px dotted color-mix(in oklab, var(--warn) 25%, transparent);
                color: var(--warn);
                font-size: 12px;
                text-align: center;
            }
            .card-title {
                font-size: 10.5px;
                font-weight: 500;
                color: var(--text-mute);
                text-transform: uppercase;
                letter-spacing: 0.14em;
                margin-bottom: 12px;
            }
            .qr-wrap {
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg-elev-2);
                border: 1px solid var(--border-soft);
                border-radius: 10px;
                padding: 24px;
            }
            .qr-wrap svg {
                width: 200px;
                height: 200px;
                display: block;
            }
            .qr-wrap + .rows {
                margin-top: 12px;
            }
            .rows {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .row {
                background: var(--bg-elev);
                border: 1px solid var(--border-soft);
                border-radius: 10px;
                padding: 12px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    background 0.15s,
                    transform 0.05s;
            }
            .row:hover {
                border-color: #333;
                background: var(--bg-elev-2);
            }
            .row:active {
                transform: translateY(1px);
            }
            .row-left {
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 0;
            }
            .icon-box {
                display: grid;
                place-items: center;
                width: 24px;
                height: 24px;
                background: var(--bg-elev-2);
                border: 1px solid var(--border-soft);
                border-radius: 6px;
                flex-shrink: 0;
                font-size: 13px;
                line-height: 1;
            }
            .name {
                font-size: 13px;
                color: var(--text);
            }
            .right {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .hint {
                font-size: 11px;
                color: var(--text-mute);
            }
            .ping {
                font-size: 11px;
                color: var(--text-mute);
                font-variant-numeric: tabular-nums;
            }
            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--text-faint);
            }
            .dot.up {
                background: var(--up);
            }
            .dot.down {
                background: var(--down);
            }
            .footer {
                margin-top: 18px;
                font-size: 11px;
                color: var(--text-faint);
                text-align: center;
                line-height: 1.6;
            }
            .footer a {
                color: inherit;
                text-decoration: none;
                border-bottom: 1px dotted transparent;
                transition: border-color 0.15s;
            }
            .footer a:hover {
                border-bottom-color: currentColor;
            }
            .toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                background: var(--bg-elev);
                border: 1px solid var(--border);
                color: var(--text-dim);
                padding: 10px 22px;
                border-radius: 12px;
                font-size: 12px;
                opacity: 0;
                transition:
                    opacity 0.2s,
                    transform 0.2s;
                pointer-events: none;
                z-index: 99;
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        </style>
    </head>
    <body>
        <div class="bg-grid"></div>
        <main>
            <h1>
                <img src="/static/apple-touch-icon.png?v=2" alt="" />
                <span class="brand">веба</span> впн
            </h1>
            <div class="sub">for {{ username }}</div>
            <div class="stack">
                {% if blocked %}
                <section class="card warn">
                    ⚠️ сабка заблокирована, обратитесь по ссылке ниже
                </section>
                {% endif %}
                <section class="card">
                    <div class="card-title">subscription</div>
                    <div class="qr-wrap">{{ qr|safe }}</div>
                    <div class="rows">
                        <div class="row" onclick="copy('{{ sub_url }}')">
                            <div class="row-left">
                                <span class="icon-box">🔗</span>
                                <span class="name">copy subscription</span>
                            </div>
                            <span class="hint">URL</span>
                        </div>
                    </div>
                </section>
                <section class="card">
                    <div class="card-title">links</div>
                    <div class="rows">
                        {% for l in links %}
                        <div
                            class="row"
                            onclick="copy('{{ l.uri }}')"
                            data-name="{{ l.host }}"
                        >
                            <div class="row-left">
                                <span class="icon-box">{{ l.flag }}</span>
                                <span class="name">{{ l.name }}</span>
                            </div>
                            <div class="right">
                                <span class="ping"></span>
                                <div class="dot"></div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </section>
            </div>
            <div class="footer">
                <a href="https://t.me/wiybaa">support</a>
            </div>
        </main>
        <div class="toast" id="toast">copied</div>
        <script>
            function copy(t) {
                navigator.clipboard.writeText(t).then(function () {
                    var e = document.getElementById("toast");
                    e.classList.add("show");
                    setTimeout(function () {
                        e.classList.remove("show");
                    }, 1500);
                });
            }
            fetch("https://status.wiyba.workers.dev/")
                .then((r) => r.json())
                .then((data) => {
                    const map = Object.fromEntries(
                        (data.results || []).map((r) => [
                            r.name.split(".")[0],
                            r,
                        ]),
                    );
                    document
                        .querySelectorAll(".row[data-name]")
                        .forEach((row) => {
                            const info = map[row.dataset.name];
                            const ping = row.querySelector(".ping");
                            const dot = row.querySelector(".dot");
                            if (info && info.up) {
                                ping.textContent = info.ms + "ms";
                                dot.classList.add("up");
                            } else {
                                ping.textContent = "-";
                                dot.classList.add("down");
                            }
                        });
                })
                .catch(() => {
                    document
                        .querySelectorAll(".row[data-name]")
                        .forEach((r) => {
                            r.querySelector(".ping").textContent = "-";
                            r.querySelector(".dot").classList.add("down");
                        });
                });
        </script>
    </body>
</html>
